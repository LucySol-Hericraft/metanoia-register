<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link
        rel="stylesheet"
        href="./style.css"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
        rel="stylesheet">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css">
</head>

<body>
    <img src="./loto-bg.png" alt="" class="bg-loto">

    <div class="layout">

        <!-- Panel izquierdo -->
        <div class="left-panel">

            <div class="brand">
                <img src="./METANOIA.png" alt="" class="brandlogo">
                <div class="intro">
                    <i class="fa-solid fa-spa"></i>
                    <div>
                        <h1>Comienza tu <br>viaje interior</h1>
                        <div class="separator separator-icon">
                        </div>
                        <p>
                            En <span>Metanoia</span> te acomapañamos<br> a crecer, aprender y tranformar<br> tu vida desde adentro.
                        </p>
                    </div>
                    
                </div>
                
            </div>
            <section class="features">
                <div class="feature">
                    <div class="feature-icon">
                        <i><img src="./icon-loto.png" alt=""></i>
                    </div>

                    <div class="feature-text">
                        <h4>Bienestar<br> integral</h4>
                    </div>
                </div>

                <div class="feature">
                    <div class="feature-icon">
                        <i><img src="./icon-leaf.png" alt=""></i>
                    </div>

                    <div class="feature-text">
                        <h4>Crecimiento<br> personal</h4>
                    </div>
                </div>

                <div class="feature">
                    <div class="feature-icon">
                        <i><img src="./icon-heart.png" alt=""></i>
                    </div>

                    <div class="feature-text">
                        <h4>Comunidad<br> consciente</h4>
                    </div>
                </div>
            </section>
        </div>

        <!-- Panel derecho -->
        <div class="right-panel">
            <div class="hidden-sec">
                <img src="./METANOIA.png" alt="Logo Metanoia" class="brandlogo">
                <div class="separator separator-icon">
                    <span>
                        <i class="fa-solid fa-spa"></i>
                    </span>
                </div>
                <h2 class="welcome">
                    Nueva cuenta
                </h2>
                <p class="slogan">
                    Unete a tu transformación
                </p>
            </div>
            <!-- Tarjeta de inicio de sesión -->
            <main class="card">
                
                <h2 class="welcome">
                    Nueva cuenta
                </h2>
                <p class="slogan">
                    Unete a tu transformación
                </p>

                <div class="separator separator-icon">
                    <span>
                        <i class="fa-solid fa-spa"></i>
                    </span>
                </div>

                <form
                    action="#"
                    method="post"
                    class="login-form"
                >

                    <!-- Usuario -->
                    <div class="form-group">

                        <label for="username">
                            Usuario
                            <span class="required-badge">!</span>
                        </label>

                        <div class="input-icon">
                            <input
                                type="text"
                                placeholder="Ingresa tu usuario"
                            >
                        </div>

                    </div>

                    <!-- Contraseña -->
                    <div class="form-group">

                        <label for="password">
                            Contraseña
                            <span class="required-badge">!</span>
                        </label>

                        <div class="input-icon">
                            <input
                                id="password"
                                type="password"
                                placeholder="Ingresa tu contraseña"
                            >
                            <button class="toggle-password" type="button">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">

                        <label for="username">
                            Email
                            <span class="required-badge">!</span>
                        </label>

                        <div class="input-icon">
                            <input
                                type="text"
                                placeholder="Ingresa tu email"
                            >
                        </div>

                    </div>

                    <!-- Confirmación email -->
                    <div class="form-group">

                        <label for="username">
                            Confirmación de email
                            <span class="required-badge">!</span>
                        </label>

                        <div class="input-icon">
                            <input
                                type="text"
                                placeholder="Confirma tu email"
                            >
                        </div>

                    </div>

                    <!-- Nombre -->
                    <div class="form-group">

                        <label for="username">
                            Nombre(s)
                            <span class="required-badge">!</span>
                        </label>

                        <div class="input-icon">
                            <input
                                type="text"
                                placeholder="Ingresa tu(s) nombre(s)"
                            >
                        </div>

                    </div>

                    <!-- Apellidos -->
                    <div class="form-group">

                        <label for="username">
                            Apellido(s)
                            <span class="required-badge">!</span>
                        </label>

                        <div class="input-icon">
                            <input
                                type="text"
                                placeholder="Ingresa tu(s) apellido(s)"
                            >
                        </div>

                    </div>

                    <!-- Ciudad -->
                    <div class="form-group">

                        <label for="username">
                            Ciudad
                            <span class="required-badge">!</span>
                        </label>

                        <div class="input-icon">
                            <input
                                type="text"
                                placeholder="Ingresa tu ciudad"
                            >
                        </div>

                    </div>

                    <div class="form-group">

                        <label for="country">
                            País
                        </label>

                        <div class="input-icon">

                            <select id="country" name="country">

                                <option value="">Selecciona un país</option>

                                <option value="mx">México</option>
                                <option value="us">Estados Unidos</option>
                                <option value="ca">Canadá</option>
                                <option value="ar">Argentina</option>
                                <option value="cl">Chile</option>
                                <option value="co">Colombia</option>
                                <option value="es">España</option>

                            </select>

                        </div>

                    </div>

                    <!-- Botón -->
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Crear mi cuenta
                    </button>

                    <button
                        type="submit"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </button>
                </form>
                <div class="singup">
                    <p>¿Ya tienes una cuenta?
                        <a href="">Iniciar sesión</a>
                    </p>
                </div>
            </main>
        </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
<script src="script.js"></script>

</body>
</html>
